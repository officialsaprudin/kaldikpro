name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Capacitor Android
        run: |
          rm -rf www android package.json package-lock.json capacitor.config.json
          mkdir -p www
          find . -name "index.html" -not -path "./www/*" -exec cp {} www/index.html \;
          find . -name "manifest.json" -not -path "./www/*" -exec cp {} www/manifest.json \; || true
          find . -name "sw.js" -not -path "./www/*" -exec cp {} www/sw.js \; || true
          test -f www/index.html || echo "<h1>index.html belum diupload</h1>" > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "KaldikPro" "id.sch.kaldikpro.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../KaldikPro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaldikPro-Android-APK
          path: KaldikPro.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "KaldikPro Android APK (Build #${{ github.run_number }})"
          body: "Unduh file **KaldikPro.apk** di bawah ini dan instal langsung di HP Android Anda."
          files: KaldikPro.apk
